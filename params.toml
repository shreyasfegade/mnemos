# SINGLE SOURCE OF TRUTH for every tunable in Mnemos.
# Rust reads this via mnemos-core::Params; Python reads it via mnemos.params;
# the paper's configuration table is generated from it by `just paper-params`.
#
# RULE: if a number appears in the specification §6, ARCHITECTURE.md, or any source file,
# it must come from here. No magic numbers anywhere else.

schema_version = 2

[crypto]
# Content AEAD. XChaCha20-Poly1305: 192-bit random nonce is birthday-safe without a counter,
# which matters because a counter is state, and state on disk is snapshot leakage.
content_aead        = "xchacha20poly1305"
content_key_bits    = 256
content_nonce_bits  = 192
# Metadata AEAD where AES-NI dominates and nonce uniqueness is structural.
metadata_aead       = "aes256gcm"
kdf                 = "hkdf-sha256"
prf                 = "hmac-sha256"
prf_tag_bits        = 128          # truncated
pprf                = "ggm-aes128" # Diana-style puncturable PRF; symmetric only
pprf_depth          = 32
block_size_bytes    = 4096         # record padding granularity
max_entry_bytes     = 65536        # larger entries spill to a padded chunk chain

[memory]
# Locked plaintext arena. TA-4 in THREAT-MODEL.md.
arena_bytes         = 2097152      # 2 MiB
lock_pages          = true         # VirtualLock / mlock
zeroise_deadline_ms = 1

[keystore]
# Ordered by preference; first available wins.
providers           = ["windows-cng-pcp", "linux-tpm2", "macos-enclave", "software"]
# The software provider is compile-gated behind --features insecure-software-keystore
# AND refuses to run unless MNEMOS_I_ACCEPT_INSECURE=1. It exists for CI only.
require_hardware    = true

[embedding]
model               = "BAAI/bge-base-en-v1.5"
dim                 = 768
metric              = "cosine"
quantisation        = "int8-scalar"    # per-vector f16 scale => 770 B/vector
speed_model         = "sentence-transformers/all-MiniLM-L6-v2"
speed_dim           = 384

[index]
buckets             = 256      # B
bucket_capacity     = 64       # C slots, fully padded
probe_width         = 4        # k_probe — ALWAYS exactly this many, query-independent
decoy_buckets       = 0        # d — set to 4 for the hardened profile

# Query-equality mitigation. See docs/leakage-profile.md §4.2 and EncryptedIvf::probe_set.
# Decoys cannot close query equality: they are PRF-derived from the query *by design* (fresh
# decoys would be cancellable by intersection), which makes the whole read set a deterministic
# function of the query. A5 recovers query equality at 1.000 with these at their defaults.
probe_spread        = 2        # s — read s * probe_width partitions; s > 1 costs s× read volume
probe_retention     = 1.0      # p — probability a genuine probe is read; p < 1 costs recall
# s = 1, p = 1.0 is exactly the pre-mitigation behaviour, and every experiment that wants to
# reproduce a pre-mitigation number sets it explicitly. The *deployment* default is s = 2:
# it closes pairwise query equality outright (Youden's J 1.000 -> 0.000, E10), costs 2x read
# volume, and does not cost recall. Shipping the measurable configuration rather than the safe
# one would have been a defensible choice for a benchmark and an indefensible one for a store.

# Overflow policy. A record whose assigned partition is full spills into one of its next-nearest
# partitions instead of being dropped. Must stay below probe_width: a record spilled past the
# probe width is unfindable even by a search for its own vector.
overflow_depth      = 2        # 0 restores the old silent-drop behaviour

# EVALUATION ONLY. false reproduces finding F5 -- dummies never reach the index, so a flush
# touches exactly the real records' partitions and hands structure transfer its signal. Kept
# so E9 can measure the defect's cost rather than assert it. Never set false in a real store.
index_write_padding = true
top_k               = 10
n_max               = 65536    # declared capacity; preallocated at init
partitioner         = "spherical-kmeans"
collision_policy    = "robin-hood"  # uniquely represented => history independent

[epoch]
# The knob Theorem 1's Δ depends on. Flush on whichever trigger fires first.
epoch_ms            = 500
epoch_writes        = 16
compaction_slots    = 64       # fixed, data-independent budget per epoch
# Fixed slot-write budget per flush. Robin Hood displacement makes the raw write count
# data-dependent (a crowded neighbourhood cascades), so each flush is padded UP to this many
# slot writes with dummies. Must exceed epoch_writes by enough to absorb cascades at the
# expected load factor. MEASURED, not guessed: see the calibration harness at
# crates/mnemos-engine/tests/cascade_measurement.rs. Worst observed raw cascade was 42 writes at
# 0.60 load, so 64 gives ~1.5x margin. An earlier guess of 48 at 0.70 was wrong -- it was
# exceeded at 0.6875. See docs/leakage-profile.md section 4.1.
slot_write_budget   = 64
# **A security parameter, not a performance one.** Robin Hood cascade length grows sharply with
# the load factor; above this threshold a cascade can exceed slot_write_budget and the write
# count becomes data-dependent again -- and cascade length explodes, not degrades: measured 42
# writes at 0.60 load, 78 at 0.70, 244 at 0.875, and 1211 at 0.94. The engine REFUSES to flush
# past this bound rather than leak silently; `Grow` must fire first.
max_load_factor     = 0.60
wal_records         = 16       # == epoch_writes; WAL is always exactly this long

[v2]
# Mnemos v2 (crates/mnemos-v2). Geometry is shared with [index], [crypto] and [epoch] above:
# B = index.buckets, C = index.bucket_capacity, k = probe_width, s = probe_spread, top_k,
# dim = embedding.dim, block = crypto.block_size_bytes, w = epoch.epoch_writes, epoch_ms.
# v2 ignores the v1-only settings (slot_write_budget, max_load_factor, compaction_slots,
# overflow_depth, decoy_buckets, n_max, collision_policy); they remain because the v1 engine is
# kept as the evaluated earlier design.
payload_blocks      = 1          # fixed payload per slot, in blocks
probe_mode          = "spread"   # "spread" | "grouped"
group_size          = 8          # partitions per group when probe_mode = "grouped"
tombstone_capacity  = 4096       # pending deletions held in the sealed manifest
flush_policy        = "on_demand" # "on_demand" | "periodic"
max_staged          = 1024
permute_partitions  = true       # keyed logical-partition -> physical-region permutation
durable             = true       # fsync partition file and manifest per flush
# A refused put must not be observable. "padded" performs the same disk work an accepted record
# would have; "silent" returns without writing and reproduces the refusal channel so E9 can
# measure it. A refusal tells an observer that a topic's load exceeds C, which is a statement
# about cohort H, so the deployed default is "padded".
refusal_mode        = "padded"   # "padded" | "silent"
# Two pre-tau file versions otherwise diff to exactly the regions written between them. A full
# re-encryption at lock makes a between-session diff total, and therefore uninformative.
rewrite_at_lock     = true
# The maintenance cursor's start position otherwise reveals the pre-tau flush count mod B.
randomise_cursor    = true

[m]
# Mnemos-M (crates/mnemos-mem): the memory-resident design. Geometry is shared with [index]:
# R = index.buckets regions of C = index.bucket_capacity slots. Placement is uniformly random
# rather than by content, search runs entirely in the locked arena, and flushes are clocked.
payload_blocks      = 1
# "memory": payloads resident, so a search issues no disk read at all (closes the result channel
# against a read-observing adversary). "disk": headers only, results read by position.
payload_residency   = "memory"
# Delta: flush every this many milliseconds while unlocked, whether or not anything was written.
# This is what removes write timing, closes the derived-write channel, and turns the deletion
# bound from "within B flushes" into "within B*Delta milliseconds".
flush_ms            = 500
tombstone_capacity  = 4096
durable             = true

[targets.performance]
# Reference: N=10_000, Windows 11, 8-core Ryzen-class, NVMe, no GPU.
search_p50_ms       = 25
search_p95_ms       = 60
search_p50_decoy_ms = 45       # with decoy_buckets = 4
write_p50_ms        = 8
epoch_flush_ms      = 30
overhead_vs_plain_x = 20       # vs plaintext IVF baseline (~1.5 ms p50)
storage_overhead_x  = 2.5      # excluding preallocation

[targets.utility]
recall_at_10_probe4 = 0.90
recall_at_10_probe8 = 0.95
ndcg_degradation    = 0.03
agent_success_delta_pp = 2.0

[targets.security]
adv_hist_mnemos_max  = 0.05   # Mnemos must stay at/near chance
adv_hist_baseline_min = 0.50  # GATE G2: A3 must reach this on Sophos/Diana, or fall back
trials               = 30
confidence           = 0.95
aux_knowledge        = [0.10, 0.25, 0.50]

[sweeps]
# Ranges for the money figure (the evaluation plan §4).
buckets             = [64, 128, 256, 512, 1024]
probe_width         = [1, 2, 4, 8, 16]
decoy_buckets       = [0, 2, 4, 8]
probe_spread        = [1, 2, 4, 8]
probe_retention     = [1.0, 0.9, 0.75, 0.5]
epoch_writes        = [1, 4, 16, 64]
epoch_ms            = [100, 250, 500, 1000, 5000]
corpus_sizes        = [1000, 10000, 100000]

[datasets]
d1_hermes           = "data/d1-hermes"      # self-authored, 10k — gated on the specification T2
d2_public           = "data/d2-msmarco-nq"  # reproducible without Hermes — REQUIRED
d3_procedural       = "data/d3-swebench"    # agent skill notes
