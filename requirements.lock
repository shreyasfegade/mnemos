# Exact versions of the evaluation environment that produced every number in the paper.
#
# Generated by `pip freeze` inside the project's .venv on 2026-09-01, on the machine named in
# the paper's Setup section (Windows 11, i9-14900HX, CPU-only torch).
#
# This file exists because the alternative was tried. The evaluation stack was installed into a
# machine-wide Python, `transformers` drifted to a version its `torch` could not satisfy, and
# every experiment that embeds anything -- four of the five -- died on an import error that
# named neither package. Diagnosing it cost a full reproduction run.
#
# Reproduce with:
#     python -m venv .venv
#     .venv/Scripts/python.exe -m pip install -r requirements.lock
#     .venv/Scripts/python.exe -m pip install -e . maturin
#     .venv/Scripts/python.exe -m maturin develop --release -m crates/mnemos-ffi/Cargo.toml
#
# `just setup` does all of that. Note that `torch` here is the CPU build; the paper's numbers are
# CPU numbers and a CUDA wheel would change the embedding timings (though not the storage ones,
# which is the half this paper measures).

